[project]
name = "promptshield-inference-hooks"
version = "0.1.0"
description = "Adaptador PromptShield para os inference hooks do Claude Enterprise (beta): assinatura, frames e vereditos. Só biblioteca padrão."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
