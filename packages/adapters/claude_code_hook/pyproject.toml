[project]
name = "promptshield-claude-hook"
version = "0.1.0"
description = "Adaptador PromptShield para os hooks do Claude Code (somente biblioteca padrão)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
promptshield-claude-hook = "promptshield_claude_hook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
