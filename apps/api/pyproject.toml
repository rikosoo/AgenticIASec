[project]
name = "promptshield-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42",
  "reportlab>=4",
  "promptshield-detection",
  "promptshield-inference-hooks",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pypdf>=4"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: exige PostgreSQL real (DATABASE_URL_TEST)", "security: testes de segurança (o CI roda este grupo à parte)"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# S = regras de segurança (equivalentes ao bandit). S101 (assert) fica de fora: aqui só estreita tipos, nunca decide acesso.
select = ["E", "F", "I", "B", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607", "S608"]
"scripts/**" = ["S105", "S106", "S311", "S603", "S607"]
"app/demo.py" = ["S311"]  # dados SINTÉTICOS de demonstração: aleatoriedade não criptográfica é o certo
