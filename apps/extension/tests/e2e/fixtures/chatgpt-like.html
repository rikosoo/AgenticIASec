<!doctype html>
<meta charset="utf-8">
<title>Página de teste com os seletores do ChatGPT (SIMULADA, não é o site real)</title>
<textarea id="prompt-textarea" rows="3" aria-label="Prompt"></textarea>
<button type="button" data-testid="send-button" aria-label="Send prompt">Enviar</button>
<script>
  window.__sent = [];
  const prompt = document.getElementById("prompt-textarea");
  function doSend() { const t = prompt.value.trim(); if (!t) return; window.__sent.push(t); prompt.value = ""; }
  document.querySelector('[data-testid="send-button"]').addEventListener("click", doSend);
  prompt.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); } });
</script>
